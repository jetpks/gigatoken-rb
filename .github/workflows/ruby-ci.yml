---
name: Ruby CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally not in this matrix: rust-toolchain.toml
        # pins nightly for src/lib.rs's #![feature(portable_simd)], and
        # neither oxidize-rb/actions/setup-ruby-and-rust's mswin toolchain
        # derivation nor magnus's Windows support have been verified against
        # a nightly cdylib build for this crate.
        os:
          - ubuntu-latest
          - macos-latest
        ruby-version:
          - "3.4"
          - "4.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@main
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          cargo-cache: true
          cache-version: v1
          # rust-toolchain.toml pins nightly, but setup-ruby-and-rust's
          # derive_toolchain.rb always feeds an explicit toolchain string to
          # dtolnay/rust-toolchain@master (defaulting to "stable"), which
          # takes precedence over file-based auto-detection. The pin must be
          # named here explicitly to get a nightly toolchain at all.
          rustup-toolchain: nightly-2026-09-18

      - name: Compile extension
        run: bundle exec rake compile

      # The workspace's default features include `python` (pyo3 abi3),
      # which links libpython — a library this fork has no surface for and
      # no runner guarantees — so the core is tested with
      # --no-default-features, the same configuration the Ruby extension
      # consumes it in. The skips are the seventeen tests that hard-require
      # ~/data corpora (r50k_base.tiktoken, TinyStoriesV2-GPT4-*.txt,
      # owt_train.txt) no CI runner has — upstream itself never runs
      # cargo test in CI. `_owt` skips the ten owt_train.txt corpus
      # diffs; the rest are exact names.
      - name: Run Rust tests
        run: >-
          cargo test --workspace --no-default-features --
          --skip basic_tokenization
          --skip test_merges_from_vocab
          --skip combinator_compare
          --skip count_matches_next
          --skip simd_matches_fast
          --skip test_pretokenizer_ts
          --skip _owt
          --skip test_safe_split_ranges_pretoken_equivalent

      - name: Run ruby tests
        run: bundle exec rspec

      - name: Lint
        run: bundle exec standardrb
